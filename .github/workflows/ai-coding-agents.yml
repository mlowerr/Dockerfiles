name: AI coding agents image

on:
  pull_request:
    paths:
      - ai-coding-agents/**
      - .github/workflows/ai-coding-agents.yml
  push:
    branches: [main]
    paths:
      - ai-coding-agents/**
      - .github/workflows/ai-coding-agents.yml
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ai-coding-agents/Dockerfile
          # Ubuntu package versions intentionally follow the selected base image's
          # repositories; treat Hadolint's pinning advice as a warning, not a failure.
          failure-threshold: error
      - name: ShellCheck
        run: shellcheck ai-coding-agents/scripts/*.sh
      - name: Validate Compose configuration
        run: |
          docker compose \
            -f ai-coding-agents/docker-compose.yml \
            -f ai-coding-agents/docker-compose.persistence.yml \
            config --quiet
      - name: Dockerfile build checks
        run: docker build --check -f ai-coding-agents/Dockerfile ai-coding-agents

  build:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build and run the amd64 image
        uses: docker/build-push-action@v6
        with:
          context: ai-coding-agents
          file: ai-coding-agents/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ai-coding-agents:test
          # Scheduled runs exist to resolve current `latest` packages and exercise
          # live vendor installers, so reusing their RUN layers would defeat the job.
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify installed harnesses as the image user
        run: docker run --rm ai-coding-agents:test verify-agents

  arm64:
    needs: lint
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build arm64 image
        uses: docker/build-push-action@v6
        with:
          context: ai-coding-agents
          file: ai-coding-agents/Dockerfile
          platforms: linux/arm64
          load: true
          tags: ai-coding-agents:test-arm64
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64
      - name: Verify installed harnesses as the image user
        run: docker run --rm ai-coding-agents:test-arm64 verify-agents
